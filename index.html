<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<meta charset="UTF-8">
<title>Meme Studio</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- DASHBOARD -->
<div id="home" class="page active">
    <h1>🔥 Meme Studio</h1>

    <div class="vertical-menu">
        <div class="card" onclick="openPage('memePage')">🖼 Meme Generator</div>
        <div class="card" onclick="openPage('chatPage')">💬 Chat Meme</div>
        <div class="card" onclick="openPage('savedPage')">📁 Saved Memes</div>
    </div>
</div>

<!-- MEME GENERATOR -->
<div id="memePage" class="page">
    <button class="back-btn" onclick="goHome()">⬅</button>
    <h2>Meme Generator</h2>

    <div class="main-layout">

        <!-- LEFT SIDE (CONTROLS) -->
        <div class="controls">

            <input type="file" id="imageInput">

            <input type="text" id="topText" placeholder="Top Text">
            <input type="text" id="bottomText" placeholder="Bottom Text">

            <div class="control-box">
                <label>Font Size</label>
                <input type="range" id="fontSize" min="20" max="60" value="30">

                <label>Font Color</label>
                <input type="color" id="fontColor" value="#ffffff">

                <label>Font Style</label>
                <select id="fontFamily">
                    <option value="Impact">Impact</option>
                    <option value="Arial">Arial</option>
                    <option value="Chiller">Chiller</option>
                    <option value="Consolas">Consolas</option>
                    <option value="Algerian">Algerian</option>
                    <option value="Calibri">Calibri</option>
                    <option value="Comic Sans MS">Comic Sans MS</option>
                    <option value="Montserrat">Montserrat</option>
                    <option value="Myriad Pro">Myriad Pro</option>
                    <option value="Helvetica">Helvetica</option>
                </select>
            </div>

            <div class="btn-grid">
    <button onclick="generateMeme()">Generate</button>
    <button onclick="downloadMeme()">Download</button>
</div>

        </div>

        <!-- RIGHT SIDE (CANVAS) -->
        <div class="preview">
            <canvas id="memeCanvas"></canvas>
        </div>

    </div>
</div>

<!-- CHAT MEME -->
<div id="chatPage" class="page">
    <button class="back-btn" onclick="goHome()">⬅</button>
    <h2>Chat Meme</h2>
<div class="chat-container">

    <!-- CHAT BOX -->
    <div id="chatBox" class="chat-box"></div>

    <!-- INPUT AREA -->
    <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Type a message...">

        <select id="emojiPicker">
            <option value="">😊</option>
            <option value="😂">😂</option>
            <option value="🔥">🔥</option>
            <option value="💀">💀</option>
            <option value="😎">😎</option>
            <option value="😭">😭</option>
            <option value="😅">😅</option>
            <option value="🥹">🥹</option>
            <option value="😏">😏</option>
            <option value="😒">😒</option>
            <option value="😘">😘</option>
            <option value="🙏">🙏</option>
            <option value="👍🏻">👍🏻</option>
        </select>

        <select id="sender">
            <option value="me">Me</option>
            <option value="friend">Friend</option>
        </select>
    </div>

    <!-- 🔥 BUTTONS OUTSIDE -->
    <div class="chat-btns">
        <button onclick="downloadChat()">Download</button>
        <button onclick="addMessage()">Send</button>
    </div>

</div></div>

<!-- Notify memes-->

 <div class="container">

    <!-- Editor -->
    <div class="editor">

      <h2>Notify Meme Generator</h2>

      <div class="input-group">
        <label>Select App</label>
        <select id="appSelect">
          <option value="whatsapp">WhatsApp</option>
          <option value="instagram">Instagram</option>
          <option value="discord">Discord</option>
          <option value="gmail">Gmail</option>
        </select>
      </div>

      <div class="input-group">
        <label>User Name</label>
        <input type="text" id="username" placeholder="Enter username">
      </div>

      <div class="input-group">
        <label>Meme Message</label>
        <textarea id="message" placeholder="Enter funny notification"></textarea>
      </div>

      <div class="input-group">
        <label>Time</label>
        <input type="text" id="timeInput" placeholder="2m ago">
      </div>

      <button onclick="generateMeme()">
        Generate Meme
      </button>

    </div>

    <!-- Preview -->
    <div class="preview-area">

      <div class="phone">

        <div class="status-bar">
          <span>9:41</span>
          <span>🔋 98%</span>
        </div>

        <div class="notification">

          <div class="app-icon">
            <img id="previewIcon"
            src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
          </div>

          <div class="content">

            <div class="top">
              <span class="app-name" id="previewApp">
                WhatsApp
              </span>

              <span class="time" id="previewTime">
                now
              </span>
            </div>

            <div class="user" id="previewUser">
              Friend
            </div>

            <div class="message" id="previewMessage">
              Bro wake up, exam starts in 5 minutes 💀
            </div>

          </div>

        </div>

      </div>

    </div>

  </div>



<!-- SAVED MEMES -->
<div id="savedPage" class="page">
    <button onclick="goHome()">⬅ Back</button>
    <h2>Saved Memes</h2>

    <div id="savedContainer"></div>
</div>

<script type="module" src="./script.js"></script>
</body>
</html>
